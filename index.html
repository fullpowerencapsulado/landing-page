<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Full Power - Composto Natural que transforma seu corpo. Emagreça de forma natural e saudável!" />
    <meta name="keywords" content="emagrecimento, natural, full power, perda de peso, saúde" />
    <meta property="og:title" content="Full Power - Transforme Seu Corpo Naturalmente" />
    <meta property="og:description" content="Mais de 15.000 mulheres já transformaram seus corpos. Descubra o método natural que funciona!" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#00d900" />

    <!-- DNS Prefetch para recursos externos -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Preload APENAS fontes críticas -->
    <link rel="preload" href="/fontes/Barlow-ThinItalic.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fontes/Barlow-BoldItalic.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Fonte Google removida - usando apenas fontes locais para velocidade -->
    <title>Full Power - Emagreça Naturalmente | Composto 100% Natural</title>

    <!-- CSS Crítico Inline - Above the fold -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{scroll-behavior:smooth}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;background:#000}
      #root{min-height:100vh}
      @font-face{font-family:'BarlowThinItalic';src:url('/fontes/Barlow-ThinItalic.ttf') format('truetype');font-weight:100;font-style:italic;font-display:swap}
      @font-face{font-family:'BarlowBoldItalic';src:url('/fontes/Barlow-BoldItalic.ttf') format('truetype');font-weight:700;font-style:italic;font-display:swap}
      #loading{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s}
      #loading.hide{opacity:0;pointer-events:none}
      .spin{animation:s .8s linear infinite;display:block}
      @keyframes s{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Loading ultra rápido -->
    <div id="loading">
      <svg class="spin" width="50" height="50" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22c55e" />
            <stop offset="50%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#loaderGrad)"
                stroke-width="4" stroke-linecap="round" stroke-dasharray="70 200"
                opacity="0.9" />
      </svg>
    </div>

    <div id="root"></div>

    <script type="module" src="/main.jsx"></script>

    <!-- Remove loading ao carregar -->
    <script>
      window.addEventListener('DOMContentLoaded',()=>{
        const l=document.getElementById('loading');
        setTimeout(()=>{l.classList.add('hide');setTimeout(()=>l.remove(),300)},50);
      });
    </script>
  </body>
</html>
